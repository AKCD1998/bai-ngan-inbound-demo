function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,docs,updatedAt:now()}));$('saveStatus').textContent='บันทึกในเครื่องนี้';return true;}catch{$('saveStatus').textContent='ยังไม่ได้บันทึก';toast('พื้นที่บันทึกไม่พร้อม · สำรองรายการไว้ก่อน');return false;}}
function filteredDocs(){const query=$('search').value.trim().toLocaleLowerCase();return docs.filter(d=>(view!=='mine'||d.owner==='คุณ')&&(filter==='all'||(filter==='active'?['ready','working'].includes(d.status):d.status===filter))&&[d.number,d.partner,d.reference,d.owner].join(' ').toLocaleLowerCase().includes(query));}
function renderStats(){const scoped=view==='mine'?docs.filter(d=>d.owner==='คุณ'):docs;const stats=[['all','ทั้งหมด',scoped.length,'files'],['review','รอตรวจ',scoped.filter(d=>d.status==='review').length,'clock'],['active','กำลังดำเนินการ',scoped.filter(d=>['ready','working'].includes(d.status)).length,'progress'],['done','เสร็จแล้ว',scoped.filter(d=>d.status==='done').length,'circleCheck']];$('stats').innerHTML=stats.map(([key,label,count,glyph])=>'<button type="button" class="stat '+(filter===key&&key!=='all'?'selected':'')+'" data-stat="'+key+'"><span class="stat-top"><span class="stat-label">'+label+'</span><span class="stat-icon">'+icon(glyph)+'</span></span><span class="stat-number">'+count+'</span></button>').join('');$('stats').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.stat;syncFilter();render();});}
function badge(d){return '<span class="status '+esc(d.status)+'">'+esc(LABELS[d.status]||LABELS.review)+'</span>';}
function render(){renderStats();const list=filteredDocs();$('navCount').textContent=docs.length;$('listHeading').textContent=view==='mine'?'รายการของฉัน':'รายการของทีม';$('visibleCount').textContent=list.length;$('listCount').textContent=list.length+' เอกสาร';$('pageTitle').textContent=view==='overview'?'ภาพรวม':view==='mine'?'งานของฉัน':'เอกสาร';$('pageSubtitle').textContent=view==='mine'?'สิ่งที่อยู่ในมือคุณ':'ดูแลทุกใบ ในที่เดียว';document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===view);b.setAttribute('aria-current',b.dataset.nav===view?'page':'false');});const board=layout==='board';$('listView').classList.toggle('active',!board);$('boardView').classList.toggle('active',board);$('listView').setAttribute('aria-pressed',String(!board));$('boardView').setAttribute('aria-pressed',String(board));if(board)renderBoard(list);else renderList(list);$('documentList').querySelectorAll('[data-document]').forEach(row=>{row.onclick=()=>openDrawer(row.dataset.document,row);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDrawer(row.dataset.document,row);}};});}
function renderList(list){if(!list.length){$('documentList').innerHTML='<div class="empty-state">'+icon('files')+'<p>'+(view==='mine'?'ยังไม่มีงานของคุณ':'ยังไม่มีเอกสารในรายการนี้')+'</p><button type="button" class="secondary" id="clearFilters">ดูทั้งหมด</button></div>';$('clearFilters').onclick=()=>{filter='all';view='documents';$('search').value='';syncFilter();render();};return;}$('documentList').innerHTML='<div class="table-wrap"><table class="doc-table"><thead><tr><th>เอกสาร</th><th class="partner-col">คู่ค้า</th><th class="money-col" style="text-align:right">มูลค่า</th><th class="owner-col">ผู้ดูแล</th><th>สถานะ</th><th class="arrow-col"></th></tr></thead><tbody>'+list.map(d=>'<tr tabindex="0" data-document="'+esc(d.id)+'" aria-label="เปิด '+esc(d.number)+'"><td><div class="doc-link"><span class="file-icon">'+icon('files')+'</span><div><span class="doc-number">'+esc(d.number)+'</span><div class="doc-sub">'+esc(shortDate(d.date))+(d.reference?' · '+esc(d.reference):'')+'</div></div></div></td><td class="partner-col"><span class="partner">'+esc(d.partner)+'</span><span class="partner-sub">'+esc(d.partnerSub||'')+'</span></td><td class="money money-col">'+esc(money(d.amount,d.currency))+'</td><td class="owner-col"><span class="owner">'+(d.owner?'<span class="owner-circle">'+esc(d.owner[0])+'</span>':'')+esc(d.owner||'—')+'</span></td><td>'+badge(d)+'</td><td class="arrow-col"><span class="row-arrow">'+icon('arrow')+'</span></td></tr>').join('')+'</tbody></table></div>';}
function renderBoard(list){$('documentList').innerHTML='<div class="board">'+STAGES.map(stage=>{const rows=list.filter(d=>d.status===stage);return '<section class="lane"><h3 class="lane-head"><span>'+LABELS[stage]+'</span><b>'+rows.length+'</b></h3>'+rows.map(d=>'<button type="button" class="board-card" data-document="'+esc(d.id)+'"><b>'+esc(d.number)+'</b><p>'+esc(d.partner)+'</p><div class="board-card-bottom"><span>'+esc(money(d.amount,d.currency))+'</span><span>'+esc(d.owner||'—')+'</span></div></button>').join('')+(!rows.length?'<div class="lane-empty">—</div>':'')+'</section>';}).join('')+'</div>';}
function syncFilter(){if(filter==='active'){$('statusFilter').value='all';}else $('statusFilter').value=filter;}
function openDrawer(id,trigger){const d=docs.find(x=>x.id===id);if(!d)return;activeId=id;returnFocus=trigger||document.activeElement;$('scrim').classList.add('open');$('drawer').classList.add('open');$('drawer').inert=false;document.querySelector('.shell').inert=true;document.body.style.overflow='hidden';renderDrawer();requestAnimationFrame(()=>$('closeDrawer').focus({preventScroll:true}));setTimeout(()=>{if(activeId===id)$('closeDrawer').focus({preventScroll:true});},260);}
function closeDrawer(){activeId=null;$('scrim').classList.remove('open');$('drawer').classList.remove('open');$('drawer').inert=true;document.querySelector('.shell').inert=false;document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus();else $('addButton').focus();}
function renderDrawer(){const d=docs.find(x=>x.id===activeId);if(!d)return;$('drawerTitle').textContent=d.number;$('drawerPartner').textContent=d.partner;$('demoTag').hidden=!d.example;const current=STAGES.indexOf(d.status);const steps='<div class="steps" aria-label="ขั้นตอนเอกสาร">'+STAGES.map((s,i)=>'<div class="step '+(i===current?'current':i<current?'past':'')+'"><span class="step-dot">'+(i<current?icon('check'):i+1)+'</span>'+LABELS[s]+'</div>').join('')+'</div>';const items=d.items||[];$('drawerBody').innerHTML=steps+'<dl class="meta-grid"><div><dt>วันที่</dt><dd>'+esc(shortDate(d.date))+'</dd></div><div><dt>มูลค่ารวม</dt><dd>'+esc(money(d.amount,d.currency))+'</dd></div><div><dt>ผู้ดูแล</dt><dd>'+esc(d.owner||'ยังไม่มอบหมาย')+'</dd></div><div><dt>สถานะ</dt><dd>'+badge(d)+'</dd></div></dl><div class="source-card"><span class="file-icon">'+icon('files')+'</span><div class="source-info"><b>'+esc(d.fileName||'ยังไม่มีไฟล์แนบ')+'</b><small>'+esc(d.reference||'เอกสารต้นฉบับ')+'</small></div><button type="button" class="secondary" id="openSource" '+(!d.fileName&&d.example?'disabled':'')+'>'+(d.attachmentStored||(d.fileURL&&location.protocol==='file:')?'เปิด':'แนบไฟล์')+'</button></div><h3 class="detail-title"><span>รายการ <span style="font-size:10px;color:#b1bba6">'+items.length+'</span></span><button type="button" id="editItemsButton">แก้ไข</button></h3>'+(items.length?'<table class="items"><thead><tr><th>สินค้า</th><th>จำนวน</th><th>มูลค่า</th></tr></thead><tbody>'+items.map(i=>'<tr><td><span class="item-name">'+esc(i.name)+'</span></td><td>'+esc(Number(i.qty).toLocaleString('en-US'))+'<span class="item-unit">'+esc(i.unit)+'</span></td><td>'+esc(money(i.qty*i.price,d.currency))+'</td></tr>').join('')+'</tbody></table>':'<div class="no-items">ยังไม่มีรายการ</div>')+'<h3 class="detail-title">บันทึก</h3><form class="note-entry" id="noteForm"><input id="noteInput" aria-label="บันทึกเพิ่มเติม" maxlength="1000" placeholder="เพิ่มบันทึก…"><button type="submit" aria-label="เพิ่มบันทึก">'+icon('send')+'</button></form><div class="notes">'+(d.notes||[]).slice().reverse().map(n=>'<div class="note">'+esc(n.text)+'<small>'+esc(timeText(n.at))+'</small></div>').join('')+'</div><details class="history"><summary>ความเคลื่อนไหว</summary><ol>'+(d.history?.length?d.history.slice().reverse().map(h=>'<li>'+esc(h.text)+'<small>'+esc(timeText(h.at))+'</small></li>').join(''):'<li>รอตรวจเอกสาร</li>')+'</ol></details>';$('drawerBody').scrollTop=0;$('advanceButton').innerHTML=(d.status==='review'?'ส่งต่อ':d.status==='ready'?'เริ่มงาน':d.status==='working'?'ปิดงาน':'เปิดงานใหม่')+icon(d.status==='done'?'progress':'right');$('advanceButton').onclick=()=>advance(d.id);$('openSource').onclick=()=>openSource(d);$('editItemsButton').onclick=()=>openEditor(d.id);$('noteForm').onsubmit=e=>{e.preventDefault();const text=$('noteInput').value.trim();if(!text)return;d.notes=d.notes||[];d.notes.push({text,at:now()});d.updatedAt=now();const saved=persist();renderDrawer();if(saved)toast('บันทึกแล้ว');};}
function advance(id){const d=docs.find(x=>x.id===id);if(!d)return;const next=d.status==='done'?'working':STAGES[STAGES.indexOf(d.status)+1];d.status=next;d.updatedAt=now();d.history=d.history||[];d.history.push({text:LABELS[next],at:now()});/* Workflow status never becomes a verified OCR or ERP-production flag. */const saved=persist();render();renderDrawer();if(saved)toast(next==='done'?'ปิดงานแล้ว':'อัปเดตแล้ว');}
function db(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('No attachment storage'));const r=indexedDB.open(STORAGE+'-files',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function storeFile(id,file){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(file,id);t.oncomplete=()=>{d.close();resolve();};t.onerror=()=>{d.close();reject(t.error);};});}
async function readFile(id){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('files','readonly');const r=t.objectStore('files').get(id);r.onsuccess=()=>{d.close();resolve(r.result);};r.onerror=()=>{d.close();reject(r.error);};});}
async function openSource(d){if(d.attachmentStored){try{const file=await readFile(d.id);if(file){const u=URL.createObjectURL(file);window.open(u,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(u),60000);return;}}catch{}toast('แนบไฟล์นี้อีกครั้ง');return;}if(d.fileURL&&location.protocol==='file:')window.open(d.fileURL,'_blank','noopener');else openEditor(d.id);}
function openEditor(id=null){const d=docs.find(x=>x.id===id);editingId=d?.id||null;pendingFile=null;editItems=structuredClone(d?.items||[]);$('editorTitle').textContent=d?'แก้ไขเอกสาร':'เพิ่มเอกสาร';$('formNumber').value=d?.number||'';$('formDate').value=d?.date||isoToday();$('formPartner').value=d?.partner||'';$('formOwner').value=d?.owner||'';$('formCurrency').value=d?.currency||'THB';$('formTax').value=d?.tax??0;$('fileLabel').textContent=d?.fileName||'วางไฟล์ หรือเลือกจากเครื่อง';$('dropzone').classList.toggle('has-file',!!d?.fileName);$('formError').textContent='';$('attachmentInput').value='';renderEditLines();$('editor').showModal();setTimeout(()=>$('formNumber').focus(),10);}
function renderEditLines(){const root=$('editLines');root.innerHTML=editItems.map((item,index)=>'<div class="edit-row" data-line="'+index+'"><input data-field="name" aria-label="สินค้าแถว '+(index+1)+'" maxlength="180" placeholder="สินค้า" value="'+esc(item.name)+'"><input data-field="qty" aria-label="จำนวนแถว '+(index+1)+'" type="number" min="0" step="any" value="'+esc(item.qty)+'"><input data-field="unit" aria-label="หน่วยแถว '+(index+1)+'" maxlength="30" placeholder="หน่วย" value="'+esc(item.unit)+'"><input data-field="price" aria-label="ราคาแถว '+(index+1)+'" type="number" min="0" step="any" value="'+esc(item.price)+'"><button type="button" class="icon-button" data-remove="'+index+'" aria-label="ลบรายการแถว '+(index+1)+'">'+icon('close')+'</button></div>').join('');root.querySelectorAll('input').forEach(input=>input.oninput=()=>{const item=editItems[+input.closest('[data-line]').dataset.line];item[input.dataset.field]=['qty','price'].includes(input.dataset.field)?Number(input.value):input.value;renderEditTotal();});root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{editItems.splice(+b.dataset.remove,1);renderEditLines();});renderEditTotal();}
function editTotal(){return editItems.reduce((n,i)=>n+Number(i.qty||0)*Number(i.price||0),0)*(1+Number($('formTax').value||0)/100);}
function renderEditTotal(){$('formTotal').textContent=editItems.length?money(editTotal(),$('formCurrency').value):'—';}
function chooseFile(file){if(!file)return;if(!(file.type==='application/pdf'||file.type.startsWith('image/')||/\.pdf$/i.test(file.name))){toast('เลือก PDF หรือรูปภาพ');return;}if(file.size>30*1024*1024){toast('เลือกไฟล์ไม่เกิน 30 MB');return;}pendingFile=file;$('fileLabel').textContent=file.name;$('dropzone').classList.add('has-file');}
async function saveEditor(e){e.preventDefault();const number=$('formNumber').value.trim(),partner=$('formPartner').value.trim();if(!number||!partner||!$('formDate').value){$('formError').textContent='กรอกเลขเอกสาร วันที่ และคู่ค้า';(!number?$('formNumber'):!partner?$('formPartner'):$('formDate')).focus();return;}const bad=editItems.some(i=>!i.name.trim()||!Number.isFinite(Number(i.qty))||i.qty<=0||!Number.isFinite(Number(i.price))||i.price<0);const tax=Number($('formTax').value||0);if(bad||!Number.isFinite(tax)||tax<0||tax>100){$('formError').textContent='ตรวจจำนวนและราคาอีกครั้ง';return;}const old=docs.find(d=>d.id===editingId);const d=old||{id:uid(),status:'review',notes:[],history:[],example:false,humanVerified:false,origin:'manual local prototype'};let stored=false;if(pendingFile){try{await storeFile(d.id,pendingFile);stored=true;}catch{$('formError').textContent='ยังบันทึกไฟล์แนบไม่ได้ · ลองอีกครั้ง';return;}}d.number=number;d.partner=partner;d.date=$('formDate').value;d.owner=$('formOwner').value.trim();d.currency=$('formCurrency').value;d.tax=tax;d.items=structuredClone(editItems);d.amount=editItems.length?Math.round(editTotal()*100)/100:null;d.updatedAt=now();d.humanVerified=false;if(stored){d.fileName=pendingFile.name;d.attachmentStored=true;d.fileURL='';d.reference='ไฟล์แนบ';}d.history=d.history||[];d.history.push({text:old?'แก้ไขข้อมูล':'เพิ่มเอกสาร',at:now()});if(!old)docs.unshift(d);const saved=persist();$('editor').close();render();if(activeId===d.id)renderDrawer();if(saved)toast('บันทึกแล้ว');}
function exportData(){const data={app:'bai-ngan',version:1,exportedAt:now(),docs};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bai-ngan-'+isoToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('สำรองรายการแล้ว');}
function cleanRecord(d){if(!d||typeof d.id!=='string'||typeof d.number!=='string'||typeof d.partner!=='string'||!STAGES.includes(d.status)||!['THB','USD','SGD'].includes(d.currency))throw Error('schema');if(!Array.isArray(d.items)||d.items.length>500)throw Error('items');if(d.amount!=null&&(!Number.isFinite(Number(d.amount))||Number(d.amount)<0))throw Error('amount');for(const i of d.items)if(typeof i.name!=='string'||typeof i.unit!=='string'||!Number.isFinite(Number(i.qty))||Number(i.qty)<=0||!Number.isFinite(Number(i.price))||Number(i.price)<0)throw Error('line');if(d.fileURL&&!d.fileURL.startsWith('file:///')&&!/^\.\/[^/]+$/.test(d.fileURL))throw Error('URL');return {...d,humanVerified:false,notes:Array.isArray(d.notes)?d.notes.filter(n=>typeof n.text==='string'&&typeof n.at==='string'):[],history:Array.isArray(d.history)?d.history.filter(h=>typeof h.text==='string'&&typeof h.at==='string'):[]};}
async function importData(file){if(!file)return;if(file.size>2*1024*1024){toast('ไฟล์รายการใหญ่เกินไป');return;}try{const parsed=JSON.parse(await file.text());if(parsed.app!=='bai-ngan'||parsed.version!==1||!Array.isArray(parsed.docs)||parsed.docs.length>500)throw Error('schema');const incoming=parsed.docs.map(cleanRecord);let added=0;const known=new Set(docs.map(d=>d.id));for(const d of incoming){if(!known.has(d.id)){docs.push(d);known.add(d.id);added++;}}const saved=persist();render();if(saved)toast(added?'เพิ่ม '+added+' เอกสารแล้ว':'มีรายการเหล่านี้แล้ว');}catch{toast('ไฟล์รายการไม่ถูกต้อง');}}
document.querySelectorAll('[data-nav]').forEach(button=>button.onclick=()=>{view=button.dataset.nav;layout=view==='overview'?'board':'list';filter='all';$('search').value='';syncFilter();render();});$('search').oninput=render;$('statusFilter').onchange=()=>{filter=$('statusFilter').value;render();};$('listView').onclick=()=>{layout='list';render();};$('boardView').onclick=()=>{layout='board';render();};$('addButton').onclick=()=>openEditor();$('editButton').onclick=()=>openEditor(activeId);$('closeDrawer').onclick=closeDrawer;$('scrim').onclick=closeDrawer;$('closeEditor').onclick=$('cancelEdit').onclick=()=>$('editor').close();$('editForm').onsubmit=saveEditor;$('addLine').onclick=()=>{editItems.push({name:'',qty:1,unit:'ชิ้น',price:0});renderEditLines();$('editLines').lastElementChild.querySelector('input').focus();};$('formCurrency').onchange=$('formTax').oninput=renderEditTotal;$('dropzone').onclick=()=>$('attachmentInput').click();$('dropzone').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('attachmentInput').click();}};$('attachmentInput').onchange=()=>chooseFile($('attachmentInput').files[0]);$('dropzone').ondragover=e=>{e.preventDefault();$('dropzone').classList.add('dragging');};$('dropzone').ondragleave=()=>$('dropzone').classList.remove('dragging');$('dropzone').ondrop=e=>{e.preventDefault();$('dropzone').classList.remove('dragging');chooseFile(e.dataTransfer.files[0]);};$('exportButton').onclick=exportData;$('importButton').onclick=()=>{$('importInput').value='';$('importInput').click();};$('importInput').onchange=()=>importData($('importInput').files[0]);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeId&&!$('editor').open)closeDrawer();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();}if(e.key==='Tab'&&activeId&&!$('editor').open){const focusable=[...$('drawer').querySelectorAll('button:not(:disabled),input,summary,a')].filter(el=>el.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('today').textContent=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'});icons();render();
</script>
