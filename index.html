function orderedReadings(d){

  const ay=y(a.r),by=y(b.r);return Number.isFinite(ay)&&Number.isFinite(by)&&ay!==by?ay-by:a.index-b.index;

function editTotal(){return editItems.reduce((n,i)=>n+Number(i.qty||0)*Number(i.price||0),0)*(1+Number($('formTax').value||0)/100);}
function renderEditTotal(){$('formTotal').textContent=editItems.length?money(editTotal(),$('formCurrency').value):'—';}
function chooseFile(file){if(!file)return;if(!(file.type==='application/pdf'||file.type.startsWith('image/')||/\.pdf$/i.test(file.name))){toast('เลือก PDF หรือรูปภาพ');return;}if(file.size>30*1024*1024){toast('เลือกไฟล์ไม่เกิน 30 MB');return;}pendingFile=file;$('fileLabel').textContent=file.name;$('dropzone').classList.add('has-file');}
async function saveEditor(e){e.preventDefault();const number=$('formNumber').value.trim(),partner=$('formPartner').value.trim();if(!number||!partner||!$('formDate').value){$('formError').textContent='กรอกเลขเอกสาร วันที่ และคู่ค้า';(!number?$('formNumber'):!partner?$('formPartner'):$('formDate')).focus();return;}const bad=editItems.some(i=>!i.name.trim()||!Number.isFinite(Number(i.qty))||i.qty<=0||!Number.isFinite(Number(i.price))||i.price<0);const tax=Number($('formTax').value||0);if(bad||!Number.isFinite(tax)||tax<0||tax>100){$('formError').textContent='ตรวจจำนวนและราคาอีกครั้ง';return;}const old=docs.find(d=>d.id===editingId);const d=old||{id:uid(),status:'review',notes:[],history:[],example:false,humanVerified:false,origin:'manual local prototype'};let stored=false;if(pendingFile){try{await storeFile(d.id,pendingFile);stored=true;}catch{$('formError').textContent='ยังบันทึกไฟล์แนบไม่ได้ · ลองอีกครั้ง';return;}}d.number=number;d.partner=partner;d.date=$('formDate').value;d.owner=$('formOwner').value.trim();d.currency=$('formCurrency').value;d.tax=tax;d.items=structuredClone(editItems);d.amount=editItems.length?Math.round(editTotal()*100)/100:null;d.updatedAt=now();d.humanVerified=false;if(stored){d.fileName=pendingFile.name;d.attachmentStored=true;d.fileURL='';d.reference='ไฟล์แนบ';}d.history=d.history||[];d.history.push({text:old?'แก้ไขข้อมูล':'เพิ่มเอกสาร',at:now()});if(!old)docs.unshift(d);const saved=persist();$('editor').close();render();if(activeId===d.id)renderDrawer();if(saved)toast('บันทึกแล้ว');}
function exportData(){const data={app:'bai-ngan',version:1,exportedAt:now(),docs};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bai-ngan-'+isoToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('สำรองรายการแล้ว');}
function cleanRecord(d){if(!d||typeof d.id!=='string'||typeof d.number!=='string'||typeof d.partner!=='string'||!STAGES.includes(d.status)||!['THB','USD','SGD'].includes(d.currency))throw Error('schema');if(!Array.isArray(d.items)||d.items.length>500)throw Error('items');if(d.readings&&(!Array.isArray(d.readings)||d.readings.length>500||d.readings.some(r=>typeof r.name!=='string'||!Array.isArray(r.fields)||r.fields.some(f=>typeof f.display!=='string'||typeof f.native_text!=='string'||!Array.isArray(f.bbox_pdf)||f.bbox_pdf.length!==4))))throw Error('readings');if(d.amount!=null&&(!Number.isFinite(Number(d.amount))||Number(d.amount)<0))throw Error('amount');for(const i of d.items)if(typeof i.name!=='string'||typeof i.unit!=='string'||!Number.isFinite(Number(i.qty))||Number(i.qty)<=0||!Number.isFinite(Number(i.price))||Number(i.price)<0)throw Error('line');if(d.fileURL&&!d.fileURL.startsWith('file:///')&&!/^\.\/[^/]+$/.test(d.fileURL))throw Error('URL');return {...d,humanVerified:false,notes:Array.isArray(d.notes)?d.notes.filter(n=>typeof n.text==='string'&&typeof n.at==='string'):[],history:Array.isArray(d.history)?d.history.filter(h=>typeof h.text==='string'&&typeof h.at==='string'):[]};}
async function importData(file){if(!file)return;if(file.size>2*1024*1024){toast('ไฟล์รายการใหญ่เกินไป');return;}try{const parsed=JSON.parse(await file.text());if(parsed.app!=='bai-ngan'||parsed.version!==1||!Array.isArray(parsed.docs)||parsed.docs.length>500)throw Error('schema');const incoming=parsed.docs.map(cleanRecord);let added=0;const known=new Set(docs.map(d=>d.id));for(const d of incoming){if(!known.has(d.id)){docs.push(d);known.add(d.id);added++;}}const saved=persist();render();if(saved)toast(added?'เพิ่ม '+added+' เอกสารแล้ว':'มีรายการเหล่านี้แล้ว');}catch{toast('ไฟล์รายการไม่ถูกต้อง');}}
document.querySelectorAll('[data-nav]').forEach(button=>button.onclick=()=>{view=button.dataset.nav;layout=view==='overview'?'board':'list';filter='all';$('search').value='';syncFilter();render();});$('search').oninput=render;$('statusFilter').onchange=()=>{filter=$('statusFilter').value;render();};$('listView').onclick=()=>{layout='list';render();};$('boardView').onclick=()=>{layout='board';render();};$('addButton').onclick=()=>openEditor();$('editButton').onclick=()=>openEditor(activeId);$('closeDrawer').onclick=closeDrawer;$('scrim').onclick=closeDrawer;$('closeEditor').onclick=$('cancelEdit').onclick=()=>$('editor').close();$('editForm').onsubmit=saveEditor;$('addLine').onclick=()=>{editItems.push({name:'',qty:1,unit:'ชิ้น',price:0});renderEditLines();$('editLines').lastElementChild.querySelector('input').focus();};$('formCurrency').onchange=$('formTax').oninput=renderEditTotal;$('dropzone').onclick=()=>$('attachmentInput').click();$('dropzone').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('attachmentInput').click();}};$('attachmentInput').onchange=()=>chooseFile($('attachmentInput').files[0]);$('dropzone').ondragover=e=>{e.preventDefault();$('dropzone').classList.add('dragging');};$('dropzone').ondragleave=()=>$('dropzone').classList.remove('dragging');$('dropzone').ondrop=e=>{e.preventDefault();$('dropzone').classList.remove('dragging');chooseFile(e.dataTransfer.files[0]);};$('exportButton').onclick=exportData;$('importButton').onclick=()=>{$('importInput').value='';$('importInput').click();};$('importInput').onchange=()=>importData($('importInput').files[0]);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeId&&!$('editor').open)closeDrawer();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();}if(e.key==='Tab'&&activeId&&!$('editor').open){const focusable=[...$('drawer').querySelectorAll('button:not(:disabled),input,summary,a')].filter(el=>el.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('today').textContent=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'});icons();render();
</script>
